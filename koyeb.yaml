# Koyeb deployment configuration
# Uses Docker for Rust application

name: hydrogene

builder:
  type: docker
  dockerfile: Dockerfile

ports:
  - port: 8080
    protocol: http

healthchecks:
  - protocol: http
    port: 8080
    path: /
    initial_delay: 15s
    interval: 30s
    timeout: 5s
    healthy_threshold: 1
    unhealthy_threshold: 3
