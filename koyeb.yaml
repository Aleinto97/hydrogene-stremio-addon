name: hydrogene

# Use pre-built image from GitHub Container Registry
builder:
  type: image
  image: ghcr.io/aleinto97/hydrogene:latest

ports:
  - port: 8080
    protocol: http

healthchecks:
  - protocol: http
    port: 8080
    path: /
    initial_delay: 10s
    interval: 30s
    timeout: 5s
    healthy_threshold: 1
    unhealthy_threshold: 3
