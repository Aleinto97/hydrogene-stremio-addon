[package]
name = "hydrogene"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[lib]
name = "hydrogene"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "stremio-addon"
path = "src/main.rs"

[dependencies]
# Web Framework
axum = { version = "0.7", features = ["tokio", "macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "compression-gzip", "trace"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTTP Client with TLS
reqwest = { version = "0.11", default-features = false, features = [
    "rustls-tls",
    "cookies",
    "json"
] }

# HTML/XML Parsing
scraper = "0.18"
quick-xml = { version = "0.31", features = ["serialize"] }

# Utilities
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Environment
dotenvy = "0.15"

# Async
futures = "0.3"
async-trait = "0.1"

# URL/URI
url = "2.5"
urlencoding = "2.1"
percent-encoding = "2.3"

# Regex for parsing
regex = "1.10"
once_cell = "1.19"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"